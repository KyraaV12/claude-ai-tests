name: Vérifier et déployer

on:
  push:
    branches: [main]
  # Sans « types », GitHub n'écoute que opened, synchronize et reopened : sortir
  # une pull request du brouillon ne déclenchait donc aucune vérification, et
  # elle pouvait être fusionnée sur la foi d'une CI qui datait ou n'existait pas.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

jobs:
  # Tourne sur chaque pull request : le signal arrive avant la fusion, pas après.
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Types, tests, construction
        run: npm run check

  deploy:
    # Rien n'est publié tant que les types et les tests ne passent pas : le site
    # en ligne ne peut pas être en avance sur ce qui a été vérifié.
    needs: check
    # Les deux conditions, pas une seule.
    #
    # La branche seule ne suffit pas : le job s'est exécuté sur une pull
    # request et y a échoué en une seconde, sans étape ni journal — la
    # signature des règles de protection de l'environnement github-pages, qui
    # n'autorisent le déploiement que depuis la branche par défaut. Un deploy
    # rouge sur chaque pull request érode le signal que la CI est censée
    # donner.
    #
    # L'événement seul ne suffit pas non plus : un workflow_dispatch lancé
    # depuis une branche publierait cette branche en production.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    # Sérialise les déploiements sans couper celui qui est en cours. Portée au
    # job seul : deux vérifications de PR n'ont aucune raison de s'attendre.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Construire le site
        run: npm run build

      - name: Empaqueter le site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Déployer
        id: deployment
        uses: actions/deploy-pages@v4
